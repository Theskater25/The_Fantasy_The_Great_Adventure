name: Deploy game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check progression and trophies
        run: |
          node tools/qa/check-trophies.mjs
          node tools/qa/check-progression-rules.mjs
          node tools/qa/check-route-reward.mjs
      - name: Prepare game files only
        run: node tools/deploy/build-site.mjs
      - name: Name this deployment attempt
        id: artifact
        run: echo "name=pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment helper
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Wait for uploaded game to be available
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: node tools/deploy/wait-pages-artifact.mjs
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
